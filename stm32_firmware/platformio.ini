[env]
platform = ststm32
board = nucleo_f767zi
framework = stm32cube
monitor_speed = 115200
lib_ldf_mode = deep+
; Hardware FPU (compile + link flags), see fpu.py
extra_scripts = pre:fpu.py

; Each environment adds its model and its app: tinyml_app.cc (DS2 serial
; benchmark) or energy_app.cc (current/energy test, see power_logger/README.md).
build_src_filter = +<*> -<model_*.cc> -<tinyml_app.cc> -<energy_app.cc>

build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -O2
    -std=gnu++17
    -D TF_LITE_STATIC_MEMORY
    -D NDEBUG
    -D CMSIS_NN
    -I lib/tflm
    -I lib/tflm/third_party/flatbuffers/include
    -I lib/tflm/third_party/gemmlowp
    -I lib/tflm/third_party/ruy
    -I lib/tflm/third_party/kissfft
    -I lib/tflm/third_party/kissfft/tools
    -I lib/tflm/third_party/cmsis_nn
    -I lib/tflm/third_party/cmsis_nn/Include
    -fno-exceptions
    -fno-rtti

platform_packages =
    toolchain-gccarmnoneeabi @ ~1.120301.0

[env:cnn]
build_src_filter = ${env.build_src_filter} +<model_cnn.cc> +<tinyml_app.cc>

[env:mlp]
build_src_filter = ${env.build_src_filter} +<model_mlp.cc> +<tinyml_app.cc>

[env:rf]
build_src_filter = ${env.build_src_filter} +<model_rf.cc> +<tinyml_app.cc>

[env:svm]
build_src_filter = ${env.build_src_filter} +<model_svm.cc> +<tinyml_app.cc>

; Current/energy test firmware (energy_app.cc): runs on its own, without the
; serial link, while the power logger measures it. See power_logger/README.md.
[env:cnn_energy]
build_src_filter = ${env.build_src_filter} +<model_cnn.cc> +<energy_app.cc>

[env:mlp_energy]
build_src_filter = ${env.build_src_filter} +<model_mlp.cc> +<energy_app.cc>

[env:rf_energy]
build_src_filter = ${env.build_src_filter} +<model_rf.cc> +<energy_app.cc>

[env:svm_energy]
build_src_filter = ${env.build_src_filter} +<model_svm.cc> +<energy_app.cc>
