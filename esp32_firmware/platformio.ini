[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; The three CNN variants share model_cnn.cc (TINYML_MODEL picks the model header).
[env:cnn_resnet]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_resnet

[env:cnn_mobilenet_v2]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_mobilenet_v2

[env:cnn_mobilenet_v3]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_mobilenet_v3

[env:mlp]
board_build.cmake_extra_args = -DTINYML_MODEL=mlp

[env:rf]
board_build.cmake_extra_args = -DTINYML_MODEL=rf

[env:svm]
board_build.cmake_extra_args = -DTINYML_MODEL=svm

; Current/energy test firmware (energy_app.cc): runs on its own, without the
; serial link, while the power logger measures it. See power_logger/README.md.
; Its sdkconfig.<model>_energy is generated from sdkconfig.defaults plus
; sdkconfig.energy.defaults (only the options that differ). After changing a
; defaults file, delete the sdkconfig.<env> files so they are generated again.
[env:cnn_resnet_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_resnet -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults

[env:cnn_mobilenet_v2_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_mobilenet_v2 -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults

[env:cnn_mobilenet_v3_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=cnn_mobilenet_v3 -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults

[env:mlp_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=mlp -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults

[env:rf_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=rf -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults

[env:svm_energy]
board_build.cmake_extra_args = -DTINYML_MODEL=svm -DTINYML_ENERGY=1 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.energy.defaults
